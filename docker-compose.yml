services:
  app:
    build:
      context: .
      args:
        # 建置期注入（sitemap / OG 圖 / canonical 都吃這個值）。
        # env_file 只在 runtime 生效，NEXT_PUBLIC_* 一定要走 build arg，換網域才會真的生效。
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://jifen.space}
    image: jifen
    container_name: jifen
    restart: unless-stopped
    # 走 Cloudflare Tunnel 時不需對外開端口（VM 零開放端口最安全）。
    # 若想直接用 IP:3000 測試，把下面 expose 改成 ports: ["3000:3000"]。
    expose:
      - "3000"
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATA_DIR: /app/data
      DATABASE_URL: file:/app/data/jifen.db
      TZ: Asia/Taipei
    volumes:
      # SQLite 資料庫與上傳圖片持久化於具名 volume
      - jifen-data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  # 方式 A：TUNNEL_TOKEN（Cloudflare Dashboard → Docker 安裝指令取得）
  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    container_name: jifen-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    env_file:
      - .env.production
    depends_on:
      app:
        condition: service_healthy

  # 方式 B：credentials + config.yml（scripts/cloudflare-tunnel-bootstrap.sh 產生）
  cloudflared-creds:
    profiles: ["tunnel-creds"]
    image: cloudflare/cloudflared:latest
    container_name: jifen-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    depends_on:
      app:
        condition: service_healthy

volumes:
  jifen-data:
